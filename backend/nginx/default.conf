# Tashqi proxy (ngrok / load balancer) yuborgan X-Forwarded-Proto'ni saqlaymiz;
# to'g'ridan-to'g'ri kelganda esa o'z sxemamizni ishlatamiz.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ===== LOKAL / HTTP (8080 -> 80) =====
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # DIQQAT: /media/ ataylab OCHIQ BERILMAYDI — selfilar faqat admin uchun
    # himoyalangan Django view (/api/auth/selfie/<id>/) orqali ko'rinadi.

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}

